name: Deploy to GitHub Pages

# Builds the Next.js app in game/ into a static export and publishes it to
# https://<user>.github.io/<repo>/ (or https://<user>.github.io/ for a user site).
# The base path is derived automatically from the repository name in
# game/next.config.mjs, so no name needs to be typed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Build static export
        working-directory: game
        run: npm run build:pages

      # Without this, GitHub's Jekyll step ignores the _next/ folder.
      - name: Add .nojekyll
        working-directory: game
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4